[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optionsbot"
version = "0.1.0"
description = "Autonomous options trading bot: 6-month backtest -> IBKR paper trading -> (gated) live."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Phase 1 (data layer): historical chains, indicators, local Parquet cache.
data = ["pandas>=2.2", "pyarrow>=16.0", "requests>=2.32", "numpy>=1.26"]
# Phase 5 (paper/live execution): Interactive Brokers connectivity.
broker = ["ib_async>=1.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
include = ["optionsbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
